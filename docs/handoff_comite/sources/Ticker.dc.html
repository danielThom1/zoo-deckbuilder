<button style="width: 40px; border: none; background: #FFFFFF; color: #14202B; font: 800 13px Barlow, sans-serif; cursor: pointer">×1</button>
<button style="width: 40px; border: none; background: transparent; color: #FFFFFF; font: 800 13px Barlow, sans-serif; cursor: pointer">×2</button>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"flash":{"editor":"text","default":"FLASH · Un journaliste visite le parc : +30 % de visiteurs ce soir"},"rep":{"editor":"text","default":"46"},"$preview":{"width":1600,"height":34}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      flash: this.props.flash ?? 'FLASH · Un journaliste visite le parc : +30 % de visiteurs ce soir',
      rep: this.props.rep ?? '46'
    };
  }
}
</script>
